title: Energy
path: energy
icon: mdi:lightning-bolt
type: sections
max_cols: 2
dense: false
cards:
  - type: custom:button-card
    template: gh_theme_base
    name: Energy Usage
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 16px 0 8px 0
      name:
        - font-size: 22px
        - font-weight: 400

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        template: gh_energy_tile
        entity: sensor.energy_total_usage
        name: Total Usage
      - type: custom:button-card
        template: gh_energy_tile
        entity: sensor.solar_production
        name: Solar Production

  - type: custom:button-card
    template: gh_theme_base
    name: Usage Graph
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 16px 0 8px 0
      name:
        - font-size: 22px
        - font-weight: 400

  - type: custom:mini-graph-card
    entities:
      - entity: sensor.energy_total_usage
        name: Usage
      - entity: sensor.solar_production
        name: Solar
    hours_to_show: 48
    points_per_hour: 2
    line_width: 3
    font_size:
      graph: 11
    font_family: >
      "Google Sans", Roboto, sans-serif
    color_thresholds:
      - value: 0
        color: "#0F9D58"
      - value: 1000
        color: "#F9AB00"
      - value: 3000
        color: "#D93025"
    height: 160
    card_mod:
      style: |
        ha-card {
          border-radius: 20px;
          border: none;
          box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
          font-family: "Google Sans", Roboto, sans-serif;
        }
